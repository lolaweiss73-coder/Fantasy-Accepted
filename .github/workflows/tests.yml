name: tests
permissions:
  contents: write
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - run: python -m py_compile app.py morin_gateway.py storage.py
      - run: node --check static/i18n.js
      - run: node --check static/core.js
      - run: node --check static/media.js
      - run: node --check static/feed.js
      - run: node --check static/create.js
      - run: node --check static/inbox.js
      - run: node --check static/onboarding.js
      - run: node --check static/admin.js
      - run: node --check static/profile.js
      - run: node --check static/workflow.js

  kokoro_samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: python -m pip install "kokoro>=0.9.4" soundfile
      - run: python tools/generate_kokoro_samples.py
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-morin-samples
          path: static/morin_voice/*.mp3
          retention-days: 7
